<!doctype html><title>Leave</title><h1>Apply for leave</h1><form method="post"><select name="leave_type">{% for t in leave_types %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select><input name="start_date" type="date" required><input name="end_date" type="date" required><textarea name="reason"></textarea><button>Submit</button></form><h2>My requests</h2>{% for r in requests %}<p>{{r.leave_type.name}} {{r.start_date}}–{{r.end_date}}: {{r.status}}</p>{% endfor %}
