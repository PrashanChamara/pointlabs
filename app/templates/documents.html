<!doctype html><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><main><h1>Documents</h1><form method="post" enctype="multipart/form-data"><input name="category" placeholder="Passport, visa, qualification…" required><input name="file" type="file" accept="image/*,.pdf" required><button>Upload</button></form>{% for d in documents %}<p>{{d.category}} — {{d.filename}}</p>{% endfor %}</main>
