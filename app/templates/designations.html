<!doctype html><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"><main><h1>Designations</h1><form method="post"><input name="name" placeholder="New designation" required><label><input name="reporting" type="checkbox"> Reporting officer designation</label><button>Add</button></form>{% for d in designations %}<p>{{d.name}} — {{'Reporting officer' if d.is_reporting_officer_designation else 'Employee'}} <form style="display:inline" method="post" action="{{url_for('main.toggle_designation',designation_id=d.id)}}"><button>Toggle</button></form></p>{% endfor %}</main>
