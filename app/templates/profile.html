{% extends 'base.html' %}{% block content %}<section class="page-head"><div><div class="eyebrow">PERSONAL DETAILS</div><h1>My profile</h1><p>Keep your contact information current.</p></div></section><form class="form-card" method="post"><div class="list-row"><span class="avatar" style="width:56px;height:56px">{{profile.full_name[:1]}}</span><div><h2 style="margin:0">{{profile.full_name}}</h2><small>{{profile.employee_code or 'Temporary ID pending'}}</small></div></div><div class="field-grid"><label>Phone<input name="phone" value="{{profile.phone or ''}}"></label><label class="field-full">Personal address<textarea name="address">{{profile.address or ''}}</textarea></label></div><button class="primary-action">Save changes</button></form>{% endblock %}
