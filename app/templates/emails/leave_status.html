{% extends 'emails/base.html' %}{% block content %}<p style="margin:0 0 12px;color:#3c775d;font-size:11px;font-weight:700;letter-spacing:1.4px;">LEAVE UPDATE</p><h1 style="margin:0;color:#17211b;font-size:28px;line-height:35px;letter-spacing:-.7px;">Leave request {{ status }}</h1><p style="margin:16px 0 22px;color:#58665d;font-size:15px;line-height:24px;">A leave request has been <strong style="color:#17211b;">{{ status }}</strong> in Pointlabs One.</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:20px;border:1px solid #e0e9e0;border-radius:12px;"><tr><td style="padding:15px;border-bottom:1px solid #e0e9e0;color:#78847c;font-size:11px;font-weight:700;letter-spacing:1px;">EMPLOYEE</td><td style="padding:15px;border-bottom:1px solid #e0e9e0;color:#17211b;font-size:14px;font-weight:700;">{{ employee_name }}</td></tr><tr><td style="padding:15px;color:#78847c;font-size:11px;font-weight:700;letter-spacing:1px;">LEAVE TYPE</td><td style="padding:15px;color:#17211b;font-size:14px;font-weight:700;">{{ leave_type }}</td></tr></table>{% if comment %}<div style="padding:14px 16px;background:#f4faf3;border-radius:10px;color:#58665d;font-size:13px;line-height:20px;"><strong style="color:#17211b;">Reviewer note</strong><br>{{ comment }}</div>{% endif %}{% endblock %}
