<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="x-apple-disable-message-reformatting"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4faf3;color:#17211b;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;color:transparent;opacity:0;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4faf3;padding:34px 12px;"><tr><td align="center">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;overflow:hidden;background:#ffffff;border:1px solid #e0e9e0;border-radius:18px;">
      <tr><td style="padding:28px 34px 25px;background:#111410;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td style="vertical-align:middle;"><img src="cid:pointlabs-ring" width="34" height="34" alt="Pointlabs" style="display:block;border:0;outline:none;"></td><td style="padding-left:10px;vertical-align:middle;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-.4px;">Pointlabs <span style="color:#e7c66b;">One</span></td></tr></table>
      </td></tr>
      <tr><td style="padding:34px 34px 12px;">{% block content %}{% endblock %}</td></tr>
      <tr><td style="padding:22px 34px 30px;color:#6c786f;font-size:12px;line-height:19px;">This is an automated message from Pointlabs One.<br>People operations, thoughtfully connected.</td></tr>
    </table>
    <p style="max-width:600px;margin:16px 0 0;color:#8a968d;font-size:11px;line-height:17px;">© Pointlabs · Private and confidential. Please do not forward security codes.</p>
  </td></tr></table>
</body>
</html>
